<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Analysis — Hybrid Signals</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
background:#071018;
color:#d8eef0;
font-family:Inter,system-ui;
}
.glass{
background:#0b1a22;
border:1px solid rgba(255,255,255,0.05);
}
.neon{color:#00ffa3;}
.muted{color:#9aa9b3;}
</style>
</head>

<body class="p-6">

<div class="max-w-6xl mx-auto">

<h1 class="text-3xl font-bold neon mb-2">
AI Analysis — Hybrid Signals
</h1>

<p class="muted mb-6">
Symbol-level actionable analysis with SL/TP and risk-reward.
</p>

<form id="search-form" class="flex gap-3 mb-6">

<input
id="symbol-input"
placeholder="RELIANCE"
class="flex-1 p-3 rounded glass uppercase"
required
/>

<select id="timeframe" class="p-3 rounded glass">
<option value="INTRADAY">Intraday</option>
<option value="SWING" selected>Swing</option>
<option value="POSITIONAL">Positional</option>
</select>

<button
class="px-6 py-3 bg-green-400 text-black font-bold rounded">
Analyze
</button>

</form>

<div id="results-container"></div>

<p class="muted mt-8 text-sm">
Connected to Render API
</p>

</div>

<script>

const API_URL = "https://stockai-api-iuvk.onrender.com/analyze";

const form = document.getElementById("search-form");
const symbolInput = document.getElementById("symbol-input");
const results = document.getElementById("results-container");

function showLoading(){
results.innerHTML =
`<div class="glass p-4 rounded">Running analysis...</div>`;
}

function showError(msg){
results.innerHTML =
`<div class="glass p-4 rounded text-red-400">${msg}</div>`;
}

function fmt(x){
return Number(x||0).toFixed(2);
}

function renderDashboard(data){

const a = data.analysis;

results.innerHTML = `

<div class="glass p-6 rounded">

<h2 class="text-2xl font-bold neon mb-2">
${a.symbol}
</h2>

<p class="muted mb-4">${a.reason}</p>

<div class="grid grid-cols-3 gap-4">

<div class="glass p-3 rounded">
<div class="muted text-sm">Latest</div>
<div class="text-xl font-bold">₹${fmt(a.latestPrice)}</div>
</div>

<div class="glass p-3 rounded">
<div class="muted text-sm">Take Profit</div>
<div class="text-xl font-bold text-green-400">₹${fmt(a.tp)}</div>
</div>

<div class="glass p-3 rounded">
<div class="muted text-sm">Stop Loss</div>
<div class="text-xl font-bold text-red-400">₹${fmt(a.sl)}</div>
</div>

</div>

<div class="mt-6">

<canvas id="chart" height="120"></canvas>

</div>

</div>
`;

try{

const ctx = document.getElementById("chart");

new Chart(ctx,{
type:"line",
data:{
labels:(data.series||[]).map(s=>new Date(s.t).toLocaleTimeString()),
datasets:[{
label:"Price",
data:(data.series||[]).map(s=>s.c),
borderColor:"#00ffa3",
pointRadius:0
}]
}
});

}catch(e){
console.warn(e);
}

}

async function analyzeStock(e){

e.preventDefault();

const symbol = symbolInput.value.trim().toUpperCase();
const timeframe = document.getElementById("timeframe").value;

if(!symbol) return;

showLoading();

try{

const controller = new AbortController();

setTimeout(()=>controller.abort(),15000);

const resp = await fetch(API_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
symbol,
timeframe
}),
signal:controller.signal
});

if(!resp.ok){
throw new Error("API returned error");
}

const data = await resp.json();

renderDashboard(data);

}catch(err){

console.error(err);

showError(
"Failed to fetch data from API. Backend may be sleeping (Render free tier takes ~30s to wake). Try again."
);

}

}

form.addEventListener("submit",analyzeStock);

</script>

</body>
</html>
